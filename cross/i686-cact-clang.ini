# Meson cross file for the Cact x86-32 freestanding kernel.
#
#   meson setup build-meson --cross-file cross/i686-cact-clang.ini
#
# clang is a cross compiler by default: "-m32" is all it needs to emit i386
# code, and no 32-bit libc is involved because the kernel is linked with
# ld.lld/ld and linker.ld instead of the compiler driver.
#
# system = 'none' marks the target as bare metal so Meson does not assume a
# hosted C library or add host-specific default flags.

[binaries]
c = 'clang'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m32']

[host_machine]
system = 'none'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
