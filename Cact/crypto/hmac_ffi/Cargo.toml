[package]
name = "cact_hmac_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
x25519-dalek = { version = "2", default-features = false, features = ["precomputed-tables", "static_secrets"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
