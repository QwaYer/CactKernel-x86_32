[package]
name = "cact_hmac_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
