[package]
name = "cact_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
cact_shim = { path = "cact_shim" }

# vendored rustls (patched for cact_shim)
rustls = { path = "vendor/rustls-0.23.40/rustls", default-features = false, features = ["hashbrown"] }
# vendored webpki — same copy rustls uses, so the algorithms below slot straight
# into its chain validation
webpki = { path = "vendor/rustls-webpki", package = "rustls-webpki", default-features = false, features = ["alloc"] }

# pure-Rust no_std crypto.  sha2 is built force-soft on purpose: the
# cpufeatures-dispatched SIMD backends are unusable in kernel mode (the C build
# flags say -mno-sse, and fpu_hd.c enables only CR4.OSFXSR — never OSXSAVE, so
# an AVX2 backend would take #UD).  hmac_ffi builds sha2 the same way.
sha2 = { version = "0.10", default-features = false, features = ["oid", "force-soft"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
aead = { version = "0.5", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8"] }
rsa = { version = "0.9", default-features = false, features = ["u64_digit"] }
signature = { version = "2", default-features = false }
const-oid = { version = "0.9", default-features = false }
elliptic-curve = { version = "0.13", default-features = false }
rand_core = { version = "0.6", default-features = false }
typenum = "1"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
