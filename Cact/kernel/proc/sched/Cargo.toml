[package]
name    = "sched"
version = "0.1.0"
edition = "2021"

[dependencies]
cact_sync = { path = "../../sync" }
cact_mm   = { path = "../../memory/rust_mm" }

[lib]
name       = "sched"
crate-type = ["lib"]

[profile.release]
panic           = "abort"
opt-level       = 2
lto             = true
codegen-units   = 1
overflow-checks = true
debug           = false

[profile.dev]
panic           = "abort"
overflow-checks = true
